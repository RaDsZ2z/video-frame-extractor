<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>序列帧提取工具</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #1e1e1e; color: #ddd;
         max-width: 1100px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; } h2 { font-size: 16px; color: #7ec8ff; margin-top: 28px;
         border-left: 4px solid #7ec8ff; padding-left: 8px; }
  .card { background: #2a2a2a; border-radius: 8px; padding: 16px; margin-top: 10px; }
  label { font-size: 13px; margin-right: 6px; }
  input[type=number], input[type=text], select { background: #1e1e1e; color: #ddd;
         border: 1px solid #555; border-radius: 4px; padding: 4px 6px; }
  input[type=number], input[type=text] { width: 70px; }
  select { max-width: 260px; }
  button { background: #3a7bd5; color: #fff; border: 0; border-radius: 5px;
           padding: 7px 16px; cursor: pointer; font-size: 14px; margin-right: 8px; }
  button:hover { background: #4a8ce5; } button:disabled { background: #555; cursor: default; }
  button.ghost { background: #444; }
  #status { font-size: 13px; color: #9d9; margin-left: 8px; white-space: pre-wrap; }
  .err { color: #ff7b7b !important; }
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
          gap: 8px; margin-top: 12px; max-height: 520px; overflow-y: auto; }
  .cell { position: relative; cursor: pointer; border: 2px solid transparent;
          border-radius: 4px; overflow: hidden;
          background: repeating-conic-gradient(#444 0 25%, #555 0 50%) 0 0 / 16px 16px; }
  .cell img { width: 100%; display: block; }
  .cell .num { position: absolute; left: 0; bottom: 0; background: rgba(0,0,0,.65);
               color: #ffe14d; font-size: 12px; padding: 1px 5px; }
  .cell.sel { border-color: #ffe14d; }
  .cell.sel::after { content: "✓"; position: absolute; right: 4px; top: 2px;
                     color: #ffe14d; font-weight: bold; }
  img.result { max-width: 100%; margin-top: 12px; border-radius: 6px; background: #444; }
  .hidden { display: none; }
  .pairs { font-size: 13px; color: #bbb; word-break: break-all; }
</style>
</head>
<body>
<h1>序列帧提取工具（视频 → PNG → 挑帧 → 预览）</h1>

<h2>1. 选择视频并抽帧</h2>
<div class="card">
  <div class="row">
    <input type="file" id="file" accept="video/mp4,video/*">
    <label><input type="checkbox" id="green" checked> 绿幕抠图</label>
  </div>
  <div class="row">
    <span style="font-size:13px;color:#bbb">或直接抽 input/ 里已有的视频（新上传的也会自动收纳进 input/）：</span>
    <select id="videoList"><option value="">（选择已有视频）</option></select>
  </div>
  <div class="row" id="greenOpts">
    <label>幕布颜色
    <input type="text" id="colorHex" value="#00ff00" style="width:80px" title="十六进制颜色，如 #FFFFFF">
    <span style="margin:0 2px 0 8px">R</span><input type="number" id="cR" value="0" min="0" max="255" style="width:56px">
    <span style="margin:0 2px">G</span><input type="number" id="cG" value="255" min="0" max="255" style="width:56px">
    <span style="margin:0 2px">B</span><input type="number" id="cB" value="0" min="0" max="255" style="width:56px">
    <span id="swatch" title="当前抠图颜色" style="display:inline-block;width:22px;height:22px;
          background:#00ff00;border:1px solid #888;border-radius:4px;vertical-align:middle;margin-left:6px"></span></label>
    <label>容差 <input type="text" id="similarity" value="0.08"></label>
    <label>柔化 <input type="text" id="blend" value="0.02"></label>
  </div>
  <div class="row" id="videoRow" style="display:none">
    <video id="video" controls muted style="max-width:480px;max-height:320px;cursor:crosshair"></video>
    <span style="font-size:13px;color:#bbb">原视频取色区 · 暂停后点击画面选取幕布颜色。抽帧结果见下方缩略图。</span>
  </div>
  <div class="row">
    <button id="btnExtract">开始抽帧</button><span id="status"></span>
  </div>
  <div class="row">
    <span style="font-size:13px;color:#bbb">打开 output/ 里已有的项目继续挑帧：</span>
    <select id="projList"></select>
    <button id="btnOpen" class="ghost">打开项目</button>
    <span id="curName" style="font-size:13px;color:#7ec8ff"></span>
  </div>
</div>

<div id="step2" class="hidden">
<h2>2. 挑帧</h2>
<div class="card">
  <div class="row">
    <button id="btnSheet" class="ghost">生成总览拼图</button>
    <button id="btnDiff" class="ghost">帧差异分析</button>
    <button id="btnLoop" class="ghost">自动找循环</button>
    <button id="btnAll" class="ghost">全选</button>
    <button id="btnNone" class="ghost">清空选择</button>
    <span id="selInfo" style="font-size:13px;color:#ffe14d"></span>
  </div>
  <div id="sheetBox"></div>
  <div id="diffBox"></div>
  <div id="loopBox"></div>
  <div id="grid"></div>
</div>

<h2>3. 预览动画</h2>
<div class="card">
  <div class="row">
    <label>帧率 <input type="number" id="fps" value="12" min="1" max="60"></label>
    <button id="btnPreview">生成预览 GIF</button>
  </div>
  <div id="gifBox"></div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
let frames = [], selected = new Set(), current = "";
let frameVersion = 0;

const pad = n => String(n).padStart(5, '0');
const esc = s => s.replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status = (msg, isErr) => { $('status').textContent = msg;
  $('status').className = isErr ? 'err' : ''; };

// 统一的接口调用：网络异常、或响应不是 JSON（如旧版本服务返回的 404 页面），
// 都转成可读错误，避免异步异常被吞掉、界面停在"分析中…"
async function callJSON(url, opts) {
  let r;
  try { r = await fetch(url, opts); }
  catch (e) { return { error: `请求失败：${e.message || e}。请确认服务终端窗口还在运行` }; }
  const text = await r.text();
  try { return JSON.parse(text); }
  catch { return { error: `服务返回了无法识别的响应（HTTP ${r.status}）。若终端里跑的是旧版本服务，请把所有服务终端窗口关掉后重新启动网页版` }; }
}
const setCurrent = name => { current = name;
  $('curName').textContent = name ? `当前项目：${name}（output/${name}/）` : ''; };

// 拉取 input/ 视频列表和 output/ 项目列表，填充两个下拉框
async function refreshLists() {
  const d = await (await fetch('/api/list')).json();
  const selectedVideo = $('videoList').value;
  $('videoList').innerHTML = '<option value="">（选择已有视频）</option>' +
    d.videos.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if (d.videos.includes(selectedVideo)) $('videoList').value = selectedVideo;
  $('projList').innerHTML = '<option value="">（选择已有项目）</option>' +
    d.projects.map(p => `<option value="${esc(p.name)}">${esc(p.name)}（${p.frames} 帧）</option>`).join('');
}
refreshLists();

$('green').onchange = e => $('greenOpts').style.display = e.target.checked ? 'flex' : 'none';

// 幕布颜色：hex 输入框与 R/G/B 三个数值框双向同步，色块联动。
// 接受 #FFFFFF / FFFFFF / 0xFFFFFF；返回规范化后的 #RRGGBB，非法返回 null
function parseHex(v) {
  v = v.trim().replace(/^0x/i, '');
  if (!v.startsWith('#')) v = '#' + v;
  return /^#[0-9a-fA-F]{6}$/.test(v) ? v : null;
}
function hexColor() { return parseHex($('colorHex').value); }

function setColor(hex) {          // 统一的落点：三处输入 + 色块一起更新
  const n = parseInt(hex.slice(1), 16);
  $('colorHex').value = hex;
  $('cR').value = (n >> 16) & 255;
  $('cG').value = (n >> 8) & 255;
  $('cB').value = n & 255;
  $('swatch').style.background = hex;
}

$('colorHex').oninput = () => {   // hex 框变动 -> 同步 RGB 框和色块
  const c = hexColor();
  $('colorHex').style.borderColor = c ? '#555' : '#ff7b7b';
  if (c) setColor(c);
};
const onRgb = () => {             // RGB 框变动 -> 同步 hex 框和色块
  const ch = [$('cR'), $('cG'), $('cB')].map(el => el.value === '' ? NaN : +el.value);
  const bad = ch.some(n => isNaN(n) || n < 0 || n > 255);
  [$('cR'), $('cG'), $('cB')].forEach(el => el.style.borderColor = bad ? '#ff7b7b' : '#555');
  if (!bad) {
    const hex = '#' + ch.map(n => n.toString(16).padStart(2, '0')).join('');
    $('colorHex').value = hex;
    $('colorHex').style.borderColor = '#555';
    $('swatch').style.background = hex;
  }
};
$('cR').oninput = $('cG').oninput = $('cB').oninput = onRgb;

// 选好视频后本地预览，点击画面取该像素颜色
$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  $('videoList').value = '';      // 文件选择与下拉框互斥，以最后操作为准
  $('video').src = URL.createObjectURL(f);
  $('videoRow').style.display = 'flex';
};
$('videoList').onchange = e => {  // 选了 input/ 已有视频：清掉文件选择，改从服务器加载预览
  const v = e.target.value;
  if (!v) return;
  $('file').value = '';
  $('video').src = '/in/' + encodeURIComponent(v);
  $('videoRow').style.display = 'flex';
};
$('video').onclick = e => {
  const v = e.target;
  if (!v.videoWidth) return;
  const r = v.getBoundingClientRect();
  // 视频画面在元素内是按比例居中显示的，算出实际画面区域
  const scale = Math.min(r.width / v.videoWidth, r.height / v.videoHeight);
  const vw = v.videoWidth * scale, vh = v.videoHeight * scale;
  const ox = (r.width - vw) / 2, oy = (r.height - vh) / 2;
  const x = Math.floor((e.clientX - r.left - ox) / scale);
  const y = Math.floor((e.clientY - r.top - oy) / scale);
  if (x < 0 || y < 0 || x >= v.videoWidth || y >= v.videoHeight) return;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const [rr, gg, bb] = c.getContext('2d').getImageData(x, y, 1, 1).data;
  const hex = '#' + [rr, gg, bb].map(n => n.toString(16).padStart(2, '0')).join('');
  setColor(hex);
  $('colorHex').style.borderColor = '#555';
};

$('btnExtract').onclick = async () => {
  const f = $('file').files[0], exist = $('videoList').value;
  if (!f && !exist) return status('请先选择视频文件', true);
  const color = hexColor();
  if (!color) return status('幕布颜色格式不正确：hex 需为 #FFFFFF 形式，或改用 R/G/B 数值输入', true);
  const q = new URLSearchParams({
    green: $('green').checked ? '1' : '0',
    color, similarity: $('similarity').value, blend: $('blend').value });
  let body = null;
  if (f) { q.set('name', f.name); body = f; }   // 上传新视频
  else q.set('input', exist);                   // 抽 input/ 里已有的视频
  status('正在抽帧，请稍候…');
  $('btnExtract').disabled = true;
  try {
    const d = await callJSON('/api/extract?' + q, { method: 'POST', body });
    if (d.error) return status(d.error, true);
    setCurrent(d.name);
    status(`完成，共 ${d.count} 帧，保存在 output/${d.name}/frames/`);
    await loadFrames();
    refreshLists();
    $('step2').classList.remove('hidden');
  } finally { $('btnExtract').disabled = false; }
};

$('btnOpen').onclick = async () => {  // 打开 output/ 里已有的项目继续挑帧
  const name = $('projList').value;
  if (!name) return status('请先选择要打开的项目', true);
  setCurrent(name);
  status('');
  await loadFrames();
  if (frames.length) $('step2').classList.remove('hidden');
};

async function loadFrames() {
  const d = await (await fetch('/api/frames?name=' + encodeURIComponent(current))).json();
  frames = d.frames; selected = new Set(frames);
  frameVersion = Date.now();
  for (const id of ['sheetBox', 'diffBox', 'loopBox', 'gifBox']) $(id).replaceChildren();
  if (!frames.length) status(`output/${current}/frames/ 里没有帧，请先抽帧`, true);
  renderGrid();
}

function renderGrid() {
  $('grid').innerHTML = frames.map(n =>
    `<div class="cell ${selected.has(n) ? 'sel' : ''}" data-n="${n}">
       <img loading="lazy" src="/out/${encodeURIComponent(current)}/frames/frame_${pad(n)}.png?v=${frameVersion}"><span class="num">${n}</span>
     </div>`).join('');
  document.querySelectorAll('.cell').forEach(c => c.onclick = () => {
    const n = +c.dataset.n;
    selected.has(n) ? selected.delete(n) : selected.add(n);
    c.classList.toggle('sel'); updateSelInfo();
  });
  updateSelInfo();
}
const updateSelInfo = () => $('selInfo').textContent = `已选 ${selected.size} / ${frames.length} 帧`;
$('btnAll').onclick = () => { selected = new Set(frames); renderGrid(); };
$('btnNone').onclick = () => { selected.clear(); renderGrid(); };

$('btnSheet').onclick = async () => {
  $('sheetBox').innerHTML = '<span style="font-size:13px">生成中…</span>';
  const d = await callJSON('/api/sheet', { method: 'POST',
    body: JSON.stringify({ name: current }) });
  $('sheetBox').innerHTML = d.error ? `<span class="err">${d.error}</span>`
    : `<img class="result" src="${d.url}?t=${Date.now()}">`;
};

$('btnDiff').onclick = async () => {
  $('diffBox').innerHTML = '<span style="font-size:13px">分析中…</span>';
  const d = await callJSON('/api/diff?name=' + encodeURIComponent(current));
  if (d.error) return $('diffBox').innerHTML = `<span class="err">${d.error}</span>`;
  const fmt = arr => arr.length ? arr.map(p => p.join('-')).join(', ') : '无';
  $('diffBox').innerHTML = `
    <img class="result" src="${d.chart_url}?t=${Date.now()}">
    <p class="pairs">平均差异 ${d.avg}，最大 ${d.max}<br>
    接近静止（可删冗余）: ${fmt(d.still)}<br>
    剧烈变化（建议保留）: ${fmt(d.peak)}</p>`;
};

$('btnLoop').onclick = async () => {
  $('loopBox').innerHTML = '<span style="font-size:13px">分析中…</span>';
  const d = await callJSON('/api/loop', { method: 'POST',
    body: JSON.stringify({ name: current, fps: +$('fps').value }) });
  if (d.error) return $('loopBox').innerHTML = `<span class="err">${d.error}</span>`;
  let html = '<p class="pairs">';
  if (d.warning) html += `<span class="err">${d.warning}</span><br>`;
  html += `最佳循环：第 ${d.start_num}-${d.end_num} 帧，共 ${d.period} 帧，接缝差异 ${d.seam}（${d.grade}）<br>
    周期候选：${d.ranking.map(r => `T=${r[0]} ${r[1].toFixed(2)}`).join('　')}`;
  if (d.dup_msg) html += `<br>${d.dup_msg}`;
  const list = (label, arr) => arr && arr.length ?
    `<br>　${label}（${arr.length} 个）: ${arr.join(',')}` : '';
  html += list('确认混合帧', d.blend_frames);
  html += list('疑似混合帧，建议人工确认', d.suspect_frames);
  html += list('规律位置但模式中断', d.missing_frames);
  html += list('近乎完全重复的帧', d.dup_frames);
  if (d.clean_spec) html += `<br>　循环内剔除确认混合帧后（${d.clean_frames.length} 帧）: ${d.clean_spec}`;
  html += `</p>
    <img class="result" src="${d.strip_url}?t=${Date.now()}"><br>
    <img class="result" src="${d.gif_url}?t=${Date.now()}" style="max-width:320px">
    <div class="row"><button id="btnSelLoop" class="ghost">选中这些循环帧（可在下方微调）</button>` +
    (d.clean_spec ? `<button id="btnSelClean" class="ghost">剔除混合帧后选中（${d.clean_frames.length} 帧）</button>` : '') +
    `</div>`;
  $('loopBox').innerHTML = html;
  const selectNums = nums => {
    selected = new Set(frames.filter(n => nums.includes(n)));
    renderGrid();
    $('grid').scrollIntoView({ behavior: 'smooth' });
  };
  $('btnSelLoop').onclick = () =>
    selectNums(frames.filter(n => n >= d.start_num && n <= d.end_num));
  if (d.clean_spec) $('btnSelClean').onclick = () => selectNums(d.clean_frames);
};

$('btnPreview').onclick = async () => {
  if (!selected.size) return alert('请先选择至少一帧');
  $('gifBox').innerHTML = '<span style="font-size:13px">生成中…</span>';
  const d = await callJSON('/api/preview', { method: 'POST',
    body: JSON.stringify({ name: current, frames: [...selected], fps: +$('fps').value }) });
  $('gifBox').innerHTML = d.error ? `<span class="err">${d.error}</span>`
    : `<img class="result" src="${d.url}?t=${Date.now()}">`;
};
</script>
</body>
</html>
